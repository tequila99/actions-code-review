name: Branch guard

# Enforces the branch/PR naming convention (see CONTRIBUTING.md "Branches and
# pull requests"). Runs for every PR into main/develop; Dependabot PRs are
# skipped at the step level rather than the job level, so the required
# `guard` status check still reports success for them instead of "skipped".

on:
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize, edited]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source and target branches
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "develop" ]; then
            echo "::error::PRs into main are only allowed from develop (got: $HEAD)"
            exit 1
          fi

          if [ "$BASE" = "develop" ]; then
            if [ "$HEAD" = "main" ]; then
              echo "::error::PRs from main into develop are not allowed"
              exit 1
            fi
            if [[ ! "$HEAD" =~ ^(feature|fix|chore)/[0-9]+-[a-z0-9-]+$ ]]; then
              echo "::error::PRs into develop are only allowed from feature|fix|chore/<issue>-<slug> (got: $HEAD)"
              exit 1
            fi
          fi

      - name: Validate PR title
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          # Release PR (develop -> main): the title is the release version.
          if [ "$BASE" = "main" ]; then
            if [[ ! "$TITLE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release PR title must be a version like 'v1.1.1' (got: $TITLE)"
              exit 1
            fi
            exit 0
          fi

          if [[ ! "$TITLE" =~ ^\[#[0-9]+\][[:space:]]+[^[:space:]].*$ ]]; then
            echo "::error::PR title must match '[#<issue>] <name>' (got: $TITLE)"
            exit 1
          fi

          if [[ "$HEAD" =~ ^(feature|fix|chore)/([0-9]+)- ]]; then
            BRANCH_ISSUE="${BASH_REMATCH[2]}"
            TITLE_ISSUE="$(echo "$TITLE" | grep -oP '^\[#\K[0-9]+')"
            if [ "$TITLE_ISSUE" != "$BRANCH_ISSUE" ]; then
              echo "::error::PR title references issue #$TITLE_ISSUE but branch $HEAD references #$BRANCH_ISSUE"
              exit 1
            fi
          fi
